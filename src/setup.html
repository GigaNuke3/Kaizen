<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .setup-container {
      text-align: center;
      padding: 40px;
      max-width: 480px;
    }
    .kai-logo { font-size: 4rem; margin-bottom: 16px; }
    h1 { color: #6ee7b7; margin-bottom: 8px; }
    p  { color: #888; margin-bottom: 32px; line-height: 1.6; }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6ee7b7, #39d353);
      border-radius: 3px;
      transition: width 0.5s ease;
      width: 0%;
    }
    .status-text { color: #6ee7b7; font-size: 0.85rem; }
    .note { color: #555; font-size: 0.8rem; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="kai-logo">🤖</div>
    <h1>Setting up Kai</h1>
    <p>Just a moment while we set up your AI companion.<br>
       This only happens once.</p>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="status-text" id="status">Initializing...</div>
    <p class="note">⚡ After this, Kai works completely offline.</p>
  </div>

  <script>
    const { ipcRenderer } = require('electron')

    ipcRenderer.on('setup-status', (event, data) => {
      document.getElementById('status').textContent = data.message
      document.getElementById('progress').style.width = data.progress + '%'
    })
  </script>
</body>
</html>
