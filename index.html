<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen</title>
  <link rel="icon" type="image/png" href="assets/icons/desktop/kaizen_desktop_icon.png">
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="stylesheet" href="src/css/dashboard.css">
  <link rel="stylesheet" href="src/css/journal.css">
  <link rel="stylesheet" href="src/css/checkmarked.css">
  <link rel="stylesheet" href="src/css/profile.css">
  <link rel="stylesheet" href="src/css/goals.css">
  <link rel="stylesheet" href="src/css/failed_goals.css">
  <link rel="stylesheet" href="src/css/badges.css">
  <link rel="stylesheet" href="src/css/notification.css">
  <link rel="stylesheet" href="src/css/completed_goals.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="assets/icons/desktop/kaizen_desktop_icon.png" alt="Kaizen Icon" class="sidebar-icon">
        <div class="sidebar-text">
          <h1>改善</h1>
          <span>Kaizen</span>
        </div>
      </div>

      <ul class="nav-links">
        <li data-page="notifications" onclick="loadPage('notifications')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img 
              src="assets/icons/bell_icon/Notification_Idle.png" 
              id="notif-nav-icon"
              alt="Notifications" 
              class="nav-icon" 
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/bell_icon/Notification.gif'"
              onmouseleave="this.src='assets/icons/bell_icon/Notification_Idle.png'"
            > Notifications
          </span>
        </li>
        <li data-page="dashboard" onclick="loadPage('dashboard')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img
              src="assets/icons/dashboard_icon/Dashboard_Idle.png"
              id="dashboard-nav-icon"
              alt="Dashboard"
              class="nav-icon"
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/dashboard_icon/Dashboard_gif.gif'"
              onmouseleave="this.src='assets/icons/dashboard_icon/Dashboard_Idle.png'"
              > Dashboard
          </span>
        </li>
        <li data-page="goals" onclick="loadPage('goals')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img
              src="assets/icons/goals_icon/Goals_Idle.png"
              id="goals-nav-icon"
              alt="Goals"
              class="nav-icon"
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/goals_icon/Goals_gif.gif'"
              onmouseleave="this.src='assets/icons/goals_icon/Goals_Idle.png'"
            > Goals
          </span>
        </li>
        <li data-page="checkmarked" onclick="loadPage('checkmarked')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img
              src="assets/icons/checkmarked_icon/CheckMarked_Idle.png"
              id="checkmarked-nav-icon"
              alt="CheckMarked"
              class="nav-icon"
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/checkmarked_icon/CheckMarked_gif.gif'"
              onmouseleave="this.src='assets/icons/checkmarked_icon/CheckMarked_Idle.png'"
            > CheckMarked
          </span>
        </li>
        <li data-page="completed_goals" onclick="loadPage('completed_goals')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img
              src="assets/icons/completed_icon/Completed_Idle.png"
              id="completed-nav-icon"
              alt="Completed Goals"
              class="nav-icon"
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/completed_icon/Completed_gif.gif'"
              onmouseleave="this.src='assets/icons/completed_icon/Completed_Idle.png'"
            > Completed Goals
          </span>
        </li>
        <li data-page="failed_goals" onclick="loadPage('failed_goals')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img
              src="assets/icons/failed_icon/Failed_Idle.png"
              id="failed-nav-icon"
              alt="Failed Goals"
              class="nav-icon"
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/failed_icon/Failed_gif.gif'"
              onmouseleave="this.src='assets/icons/failed_icon/Failed_Idle.png'"
            > Failed Goals
          </span>
        </li>
        <li data-page="badges" onclick="loadPage('badges')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img
              src="assets/icons/badges_icon/Badges_Idle.png"
              id="badges-nav-icon"
              alt="Badges"
              class="nav-icon"
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/badges_icon/Badges_gif.gif'"
              onmouseleave="this.src='assets/icons/badges_icon/Badges_Idle.png'"
            > Badges
          </span>
        </li>
        <li data-page="journal" onclick="loadPage('journal')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img
              src="assets/icons/Journal_icon/Journal_Idle.png"
              id="journal-nav-icon"
              alt="Journal"
              class="nav-icon"
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/Journal_icon/Journal_gif.gif'"
              onmouseleave="this.src='assets/icons/Journal_icon/Journal_Idle.png'"
            > Journal
          </span>
        </li>
        <li data-page="ollama_journal" onclick="loadPage('ollama_journal')">
          <span style="display: flex; align-items: center; gap: 8px;">
            <img
              src="assets/icons/companion_icon/Companion_Idle.png"
              id="companion-nav-icon"
              alt="Companion"
              class="nav-icon"
              style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
              onmouseenter="this.src='assets/icons/companion_icon/Companion_gif.gif'"
              onmouseleave="this.src='assets/icons/companion_icon/Companion_Idle.png'"
            > Companion
          </span>
        </li>
      </ul>

      <div class="sidebar-footer" data-page="profile" onclick="loadPage('profile')">
        <span style="display: flex; align-items: center; gap: 8px;">
          <img
            src="assets/icons/profile_icon/Profile_Idle.png"
            id="profile-nav-icon"
            alt="Profile"
            class="nav-icon"
            style="width: 50px; height: 50px; image-rendering: pixelated; margin: 0;"
            onmouseenter="this.src='assets/icons/profile_icon/Profile_gif.gif'"
            onmouseleave="this.src='assets/icons/profile_icon/Profile_Idle.png'"
          > Profile
        </span>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="content" id="main-content">
      <h2>Welcome to Kaizen 🚀</h2>
      <p>Your self-improvement journey starts here.</p>
    </main>

  </div>

  <script src="node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="src/js/utils.js"></script>
  <script src="src/js/sounds.js"></script>
  <script src="src/js/dashboard.js"></script>
  <script src="src/js/journal.js"></script>
  <script src="src/js/goals.js"></script>
  <script src="src/js/checkmarked.js"></script>
  <script src="src/js/completed_goals.js"></script>
  <script src="src/js/failed_goals.js"></script>
  <script src="src/js/badges.js"></script>
  <script src="src/js/notification.js"></script>
  <script src="src/js/profile.js"></script>
  <script src="src/js/sidebar-badges.js"></script>
  <script src="src/js/ollama.js"></script>
  <script src="src/js/ollama_journal.js"></script>
  <script>
    // Track current page
    let currentPage = 'dashboard'

    // Page loading function — defined first so sidebar onclicks can call it immediately
    async function loadPage(page) {
      if (!page) return

      const mainContent = document.getElementById('main-content')
      if (!mainContent) return

      try {
        mainContent.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:400px;color:#6ee7b7;">Loading...</div>'

        // Update sidebar active state
        document.querySelectorAll('[data-page]').forEach(el => el.classList.remove('active'))
        document.querySelector(`[data-page="${page}"]`)?.classList.add('active')

        currentPage = page

        // Navigation sound (respects the profile sound toggle)
        try {
          playNavSound(page)
        } catch (soundErr) {
          console.error('Nav sound error:', soundErr)
        }

        // Sidebar icon switch (idle PNG ↔ animated GIF) for all pages
        const navIcons = [
          { id: 'notif-nav-icon',       page: 'notifications',   gif: 'assets/icons/bell_icon/Notification.gif',            idle: 'assets/icons/bell_icon/Notification_Idle.png' },
          { id: 'dashboard-nav-icon',   page: 'dashboard',       gif: 'assets/icons/dashboard_icon/Dashboard_gif.gif',      idle: 'assets/icons/dashboard_icon/Dashboard_Idle.png' },
          { id: 'journal-nav-icon',     page: 'journal',         gif: 'assets/icons/Journal_icon/Journal_gif.gif',          idle: 'assets/icons/Journal_icon/Journal_Idle.png' },
          { id: 'goals-nav-icon',       page: 'goals',           gif: 'assets/icons/goals_icon/Goals_gif.gif',              idle: 'assets/icons/goals_icon/Goals_Idle.png' },
          { id: 'checkmarked-nav-icon', page: 'checkmarked',     gif: 'assets/icons/checkmarked_icon/CheckMarked_gif.gif',  idle: 'assets/icons/checkmarked_icon/CheckMarked_Idle.png' },
          { id: 'completed-nav-icon',   page: 'completed_goals', gif: 'assets/icons/completed_icon/Completed_gif.gif',      idle: 'assets/icons/completed_icon/Completed_Idle.png' },
          { id: 'failed-nav-icon',      page: 'failed_goals',    gif: 'assets/icons/failed_icon/Failed_gif.gif',            idle: 'assets/icons/failed_icon/Failed_Idle.png' },
          { id: 'badges-nav-icon',      page: 'badges',          gif: 'assets/icons/badges_icon/Badges_gif.gif',            idle: 'assets/icons/badges_icon/Badges_Idle.png' },
          { id: 'companion-nav-icon',   page: 'ollama_journal',  gif: 'assets/icons/companion_icon/Companion_gif.gif',      idle: 'assets/icons/companion_icon/Companion_Idle.png' },
          { id: 'profile-nav-icon',     page: 'profile',         gif: 'assets/icons/profile_icon/Profile_gif.gif',          idle: 'assets/icons/profile_icon/Profile_Idle.png' }
        ]
        for (const icon of navIcons) {
          const el = document.getElementById(icon.id)
          if (el) el.src = page === icon.page ? icon.gif : icon.idle
        }

        switch(page) {
          case 'dashboard':     await renderDashboard(); break
          case 'journal':       await renderJournal(); sidebarBadges?.updateJournalBadge(); break
          case 'goals':         await renderGoals(); sidebarBadges?.updateGoalsBadge(); break
          case 'failed_goals':  await renderFailedGoals(); sidebarBadges?.updateFailedBadge(); break
          case 'badges':        await renderBadges(); break
          case 'notifications': await renderNotifications(); sidebarBadges?.updateNotificationsBadge(); break
          case 'checkmarked':   await renderCheckmarks(); sidebarBadges?.updateCheckmarkedBadge(); break
          case 'completed_goals': await renderCompletedGoals(); sidebarBadges?.updateCompletedBadge(); break
          case 'profile':       await renderProfile(); break
          case 'ollama_journal':   await renderKaiPage(); break
          default: throw new Error(`Unknown page: ${page}`)
        }

        // Update all other badges in background
        sidebarBadges?.updateAllBadges()

      } catch (err) {
        console.error(`Error loading page ${page}:`, err)
        mainContent.innerHTML = `
          <div style="padding:40px;text-align:center;color:#fff;">
            <h2>❌ Failed to load page</h2>
            <p><strong>${err.message || 'Unknown error'}</strong></p>
            <pre style="background:#1a1a1a;padding:12px;border-radius:6px;overflow-x:auto;margin-top:12px;
                        text-align:left;max-height:200px;font-size:12px;color:#6ee7b7;">
${err.stack?.substring(0, 500) || ''}</pre>
            <button class="btn btn-primary" style="margin-top:20px;" onclick="loadPage('dashboard')">Back to Dashboard</button>
          </div>
        `
      }
    }

    // Expose globally IMMEDIATELY (before DOMContentLoaded) so sidebar onclicks work
    window.loadPage = loadPage

    // IPC listener for cross-page events (ipcRenderer exposed from preload.js)
    function refreshCurrentGoalPage() {
      const refreshers = {
        checkmarked: renderCheckmarks,
        failed_goals: renderFailedGoals,
        completed_goals: renderCompletedGoals,
        goals: renderGoals,
        notifications: renderNotifications,
        dashboard: renderDashboard
      }
      const refresh = refreshers[currentPage]
      if (refresh) {
        refresh().catch(err => console.error(`Error reloading ${currentPage}:`, err))
      }
    }

    if (window.ipcRenderer) {
      window.ipcRenderer.on('goals-updated', () => {
        refreshCurrentGoalPage()
      })
    } else {
      console.error('ipcRenderer not available — goals-updated listener skipped')
    }

    // Resize charts/layout when window size changes
    let resizeDebounce
    window.addEventListener('resize', () => {
      clearTimeout(resizeDebounce)
      resizeDebounce = setTimeout(() => {
        if (window.spiderChartInstance) {
          window.spiderChartInstance.resize()
        }
      }, 120)
    })

    // Load dashboard once DOM is ready — preload.js already exposed window.api
    document.addEventListener('DOMContentLoaded', async () => {
      // Load settings first so sounds and toggles have the right defaults
      try {
        window.kaizenSettings = await window.api.getSettings()
      } catch (err) {
        console.error('Failed to load settings:', err)
        window.kaizenSettings = { notifications: true, soundEnabled: true, remindersEnabled: false, reminderTime: '20:00' }
      }
      // Evaluate goals immediately on launch so failed/completed goals appear right away
      window.api.evaluateGoals().catch(err => console.error('Startup evaluateGoals error:', err))
      loadPage('dashboard')
    })

    // Listen for Kai model ready signal from main process
    if (window.ipcRenderer) {
      window.ipcRenderer.on('kai-ready', () => {
        console.log('🤖 Kai model is ready!')
        // If user is on the companion page, refresh it
        if (currentPage === 'ollama_journal') {
          renderKaiPage().catch(console.error)
        }
      })
    }
  </script>
</body>
</html>
