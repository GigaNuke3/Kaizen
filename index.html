<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <h1>改善</h1>
        <span>Kaizen</span>
      </div>

      <ul class="nav-links">
        <li class="active" onclick="loadPage('dashboard')">
          📊 Dashboard
        </li>
        <li onclick="loadPage('habits')">
          📋 Habits
        </li>
        <li onclick="loadPage('journal')">
          📓 Journal
        </li>
        <li onclick="loadPage('goals')">
          🎯 Goals
        </li>
        <li onclick="loadPage('todo')">
          📝 Todo
        </li>
      </ul>

      <div class="sidebar-footer" onclick="loadPage('profile')">
        👤 Profile
      </div>
    </nav>

    <!-- Main Content -->
    <main class="content" id="main-content">
      <h2>Welcome to Kaizen 🚀</h2>
      <p>Your self-improvement journey starts here.</p>
    </main>

  </div>

 <script src="src/js/dashboard.js"></script>
<script>
  function loadPage(page) {
    document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'))
    document.querySelectorAll('.nav-links li').forEach(li => {
      if (li.getAttribute('onclick').includes(page)) li.classList.add('active')
    })

    if (page === 'dashboard') {
      renderDashboard()
    } else {
      const content = document.getElementById('main-content')
      content.innerHTML = `<h2>${page.charAt(0).toUpperCase() + page.slice(1)}</h2><p>Coming soon...</p>`
    }
  }

  window.onload = () => loadPage('dashboard')
</script>
</body>
</html>
