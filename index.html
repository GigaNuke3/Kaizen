<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen</title>
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="stylesheet" href="src/css/dashboard.css">
  <link rel="stylesheet" href="src/css/journal.css">
  <link rel="stylesheet" href="src/css/checkmarked.css">
  <link rel="stylesheet" href="src/css/profile.css">
  <link rel="stylesheet" href="src/css/goals.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <h1>改善</h1>
        <span>Kaizen</span>
      </div>

      <ul class="nav-links">
        <li class="active" onclick="loadPage('dashboard')">
          📊 Dashboard
        </li>
         <li onclick="loadPage('goals')">
          🎯 Goals
        </li>
         <li onclick="loadPage('todo')">
          📝 CheckMarked
        </li>
        <li onclick="loadPage('journal')">
          📓 Journal
        </li>
      </ul>

      <div class="sidebar-footer" onclick="loadPage('profile')">
        👤 Profile
      </div>
    </nav>

    <!-- Main Content -->
    <main class="content" id="main-content">
      <h2>Welcome to Kaizen 🚀</h2>
      <p>Your self-improvement journey starts here.</p>
    </main>

  </div>

 <script src="src/js/api.js"></script>
 <script src="src/js/dashboard.js"></script>
 <script src="src/js/journal.js"></script>
 <script src="src/js/goals.js"></script>
 <script src="src/js/checkmarked.js"></script>
 <script src="src/js/profile.js"></script>
<script>
  async function loadPage(page) {
    document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'))
    document.querySelectorAll('.nav-links li').forEach(li => {
      if (li.getAttribute('onclick').includes(page)) li.classList.add('active')
    })

    if (page === 'dashboard') {
      await renderDashboard()
    } else if (page === 'habits') {
      await renderHabits()
    } else if (page === 'journal') {
      await renderJournal()
    } else if (page === 'goals') {
      await renderGoals()
    } else if (page === 'todo') {
      await renderCheckmarks()
    } else if (page === 'profile') {
      await renderProfile()
    }
  }

  window.onload = () => loadPage('dashboard')
</script>
</body>
</html>
