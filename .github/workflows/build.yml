name: Build Kaizen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Windows app
        run: npm run build
      
      - name: Upload Windows installer
        uses: actions/upload-artifact@v3
        with:
          name: Kaizen-Windows
          path: dist/Kaizen Setup *.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Linux app
        run: npm run build
      
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v3
        with:
          name: Kaizen-Linux
          path: dist/Kaizen-*.AppImage

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v3
        with:
          name: Kaizen-Windows

      - name: Download Linux build
        uses: actions/download-artifact@v3
        with:
          name: Kaizen-Linux

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Kaizen Setup *.exe,Kaizen-*.AppImage"
          bodyFile: "CHANGELOG.md"
